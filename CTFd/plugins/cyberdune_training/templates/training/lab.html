<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ challenge.name }}</title>
<style>body{margin:0;background:#101216;color:#e8e9ec;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;padding:24px}h1{font:600 20px/1.3 system-ui;margin:0 0 8px}p{color:#adb2bd}button,input{font:inherit;border:1px solid #3b3f48;border-radius:8px;padding:10px 14px;background:#20242c;color:#fff}button{cursor:pointer;margin:8px 8px 8px 0}button:hover{border-color:#f54753}button:focus-visible,input:focus-visible{outline:2px solid #f54753;outline-offset:3px}input{display:block;width:min(94%,650px);margin-top:12px}pre,textarea{white-space:pre-wrap;overflow-wrap:anywhere;background:#090b0e;border:1px solid #292d35;border-radius:8px;padding:16px;color:#b6e5cb;line-height:1.6}textarea{box-sizing:border-box;width:100%;min-height:190px;font:inherit;resize:vertical}.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f58b92}[hidden]{display:none!important}</style></head>
<body><span class="label">CYBERDUNE / SANDBOXED BROWSER LAB</span><h1>{{ challenge.name }}</h1><p>This self-contained exercise runs in your browser. It does not execute commands on the platform.</p><div id="tools"></div><pre id="reference"></pre><textarea id="output" hidden readonly aria-label="Lab output" spellcheck="false"></textarea>
<script>
const data = {{ payload | tojson }};
const recipe = {{ challenge.recipe | tojson }};
const tools = document.getElementById('tools'), reference = document.getElementById('reference'), output = document.getElementById('output');
function show(value) { output.value = value; output.hidden = !value; }
function button(label, callback) { const b = document.createElement('button'); b.type='button'; b.textContent=label; b.addEventListener('click',callback); tools.appendChild(b); return b; }
function input(label, value='') { const l=document.createElement('label'); l.textContent=label; const i=document.createElement('input'); i.value=value; i.maxLength=1024; l.appendChild(i); tools.appendChild(l); return i; }
if(recipe==='header-lab') {
  reference.textContent='GET /training-message HTTP/1.1\nHost: fictional.training.invalid';
  button('Inspect response headers',()=>show('HTTP/1.1 200 OK\n'+Object.entries(data.headers).map(([k,v])=>k+': '+v).join('\n')));
} else if(recipe==='rot13-lab') {
  reference.textContent='Transform: A → N, B → O … N → A';const text=input('Encoded message',data.encoded);
  button('Decode ROT13',()=>show(text.value.replace(/[A-Za-z]/g,c=>String.fromCharCode((c.charCodeAt(0)-(c<='Z'?65:97)+13)%26+(c<='Z'?65:97)))));
} else if(recipe==='logs-lab'||recipe==='pattern-lab') {
  const text=input('Filter records (literal text)');reference.textContent=data.records.join('\n');
  button('Apply filter',()=>show(data.records.filter(row=>row.toLowerCase().includes(text.value.toLowerCase())).join('\n')||'No matching records.'));
} else if(recipe==='archive-lab') {
  const path=input('Path to inspect','/');reference.textContent='Fictional archive · no external requests are made.';
  const inspect=()=>show(data.pages[path.value]||'404 — No archived page at that path.');button('Open archived page',inspect);inspect();
} else if(recipe==='stack-lab') {
  reference.textContent='buffer[16] | saved EBP[4] | saved return address[4]\nwin() address: 0x080491e2\nArchitecture model: 32-bit little-endian';const value=input('Saved return address as four hex bytes');
  button('Simulate return',()=>show(value.value.trim().toLowerCase().replace(/\s+/g,' ')===data.win?'Control flow reached win().\n'+atob(data.encoded):'The saved address does not point to win(). Check byte order.'));
} else if(recipe==='bytecode-lab') {
  const program=data.program.flatMap(row=>[['LOAD',row[1]],['XOR',row[3]],['OUT']]);let pc=0,acc=0,result='';
  function step(){if(pc>=program.length)return;const [op,value]=program[pc++];if(op==='LOAD')acc=value;else if(op==='XOR')acc^=value;else if(op==='OUT')result+=String.fromCharCode(acc);reference.textContent='pc='+pc+'  accumulator='+acc+'\nNext: '+JSON.stringify(program[pc]||['HALT']);show(result);}
  reference.textContent=program.slice(0,9).map(row=>row.join(' ')).join('\n')+'\n…';button('Step instruction',step);button('Run program',()=>{while(pc<program.length)step();});
} else if(recipe==='reassembly-lab') {
  reference.textContent=data.fragments.map(row=>'sequence='+row.sequence+'  data='+row.data).join('\n');const order=input('Sequence order, separated by spaces');
  button('Reassemble and decode',()=>{const ids=order.value.trim().split(/\s+/).map(Number);if(ids.join(',')!=='1,2,3,4'){show('The application sequence must start at 1 and increase without gaps.');return;}try{show(atob(ids.map(id=>data.fragments.find(row=>row.sequence===id).data).join('')));}catch{show('The reassembled message could not be decoded.');}});
} else if(recipe==='terminal-lab') {
  reference.textContent='A browser filesystem model. Use help to list supported commands.';let cwd='/home/trainee';const cmd=input('Command','help');
  const files=data.files,dirs=new Set(['/','/home','/home/trainee','/home/trainee/.config']);
  function path(value){const parts=(value.startsWith('/')?value:cwd+'/'+value).split('/'),result=[];for(const p of parts){if(p==='..')result.pop();else if(p&&p!=='.')result.push(p);}return '/'+result.join('/');}
  function execute(){const raw=cmd.value.trim(),[command,...args]=raw.split(/\s+/);let answer='';
    if(command==='help')answer='pwd | ls [-la] [path] | cd path | cat path | find | clear\nThese commands operate only on the provided fictional files.';
    else if(command==='pwd')answer=cwd;
    else if(command==='clear'){show('');cmd.value='';return;}
    else if(command==='cat')answer=files[path(args[0]||'')]??'No such file.';
    else if(command==='cd'){const next=path(args[0]||'/home/trainee');if(dirs.has(next))cwd=next;else answer='No such directory.';}
    else if(command==='find')answer=Object.keys(files).join('\n');
    else if(command==='ls'){const all=args.some(a=>a.startsWith('-')&&a.includes('a')),target=path(args.find(a=>!a.startsWith('-'))||'.'),prefix=target==='/'?'/':target+'/';answer=[...new Set([...dirs,...Object.keys(files)].filter(p=>p.startsWith(prefix)&&p!==target).map(p=>p.slice(prefix.length).split('/')[0]).filter(p=>all||!p.startsWith('.')))].join('  ')||'(empty)';}
    else answer='Unsupported command. Type help.';
    show((output.value+'\n'+cwd+' $ '+raw+'\n'+answer).slice(-18000));cmd.value='';
  }
  button('Run command',execute);cmd.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();execute();}});execute();
}
</script></body></html>
