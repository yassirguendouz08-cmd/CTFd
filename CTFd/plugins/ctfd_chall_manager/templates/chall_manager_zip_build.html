{% extends "admin/base.html" %}
{% block content %}
<div class="jumbotron"><div class="container"><h1>Building {{ name }}</h1></div></div>
<div class="container">
  <div id="build-status" class="alert alert-info" role="status">{{ status.message }}</div>
  <p>Keep this page open. When the build finishes, your challenge opens automatically.</p>
  <details open><summary>Build log</summary><pre id="build-log" class="bg-dark text-light p-3 mt-3" style="max-height:420px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere">{{ status.log }}</pre></details>
  <form id="finish-build" method="POST" action="{{ url_for('ctfd-chall-manager.finish_zip_build', job_id=job_id) }}">
    <input type="hidden" name="nonce" value="{{ session.get('nonce') }}">
    <button id="retry-registration" type="submit" class="btn btn-primary mt-3" hidden>Retry creating challenge</button>
  </form>
  <a class="btn btn-link mt-3" href="{{ url_for('ctfd-chall-manager.new_zip_challenge') }}">Upload another ZIP</a>
</div>
{% endblock %}
{% block scripts %}
{{ super() }}
<script>
(() => {
  const statusUrl = {{ url_for('ctfd-chall-manager.zip_build_status', job_id=job_id) | tojson }};
  const form = document.getElementById('finish-build');
  const status = document.getElementById('build-status');
  const retry = document.getElementById('retry-registration');
  let finishing = false;
  async function finish() {
    if (finishing) return;
    finishing = true;
    retry.hidden = true;
    try {
      const response = await fetch(form.action, {method:'POST', body:new FormData(form), credentials:'same-origin'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Could not create the challenge.');
      location.assign(data.url);
    } catch (error) {
      status.textContent = error.message;
      status.className = 'alert alert-danger';
      retry.hidden = false;
      finishing = false;
    }
  }
  form.addEventListener('submit', event => {event.preventDefault(); finish();});
  async function poll() {
    try {
      const response = await fetch(statusUrl, {credentials:'same-origin', cache:'no-store'});
      if (!response.ok || !response.headers.get('content-type')?.includes('application/json')) throw new Error('Please sign in again to view this build.');
      const data = await response.json();
      status.textContent = data.message;
      document.getElementById('build-log').textContent = data.log;
      if (data.state === 'ready') { await finish(); return; }
      if (data.state === 'failed') {status.className = 'alert alert-danger'; return;}
    } catch (error) {
      status.textContent = error.message;
    }
    setTimeout(poll, 2000);
  }
  poll();
})();
</script>
{% endblock %}
