{% extends "base.html" %}

{% block content %}
  {% if request.path.rstrip('/') == request.script_root.rstrip('/') %}
    {% include 'pagehome.html' %}
  {% else %}
  <div class="container cd-content-page">
    {{ content | safe }}
  </div>
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/page.js") }}
{% endblock %}
