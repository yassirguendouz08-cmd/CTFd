/* ===========================
      GLITCH EFFECT (Enhanced)
=========================== */
@keyframes glitch-anim {
  0% { clip-path: inset(0 0 0 0); transform: translate(0); }
  5% { clip-path: inset(40% 0 45% 0); transform: translate(-8px, 3px); }
  10% { clip-path: inset(92% 0 1% 0); transform: translate(8px, -2px); }
  15% { clip-path: inset(43% 0 1% 0); transform: translate(-5px, 5px); }
  20% { clip-path: inset(25% 0 58% 0); transform: translate(10px, -3px); }
  25% { clip-path: inset(0 0 0 0); transform: translate(0); }
  30% { clip-path: inset(80% 0 5% 0); transform: translate(12px, 2px); }
  35% { clip-path: inset(54% 0 7% 0); transform: translate(-10px, -4px); }
  40% { clip-path: inset(17% 0 56% 0); transform: translate(7px, 6px); }
  45% { clip-path: inset(0 0 0 0); transform: translate(0); }
  50% { clip-path: inset(63% 0 3% 0); transform: translate(-15px, 3px); }
  55% { clip-path: inset(10% 0 85% 0); transform: translate(15px, -5px); }
  60% { clip-path: inset(15% 0 70% 0); transform: translate(-8px, 4px); }
  65% { clip-path: inset(0 0 0 0); transform: translate(0); }
  70% { clip-path: inset(45% 0 40% 0); transform: translate(6px, -8px); }
  75% { clip-path: inset(88% 0 9% 0); transform: translate(-12px, 2px); }
  80% { clip-path: inset(34% 0 51% 0); transform: translate(10px, 7px); }
  85% { clip-path: inset(0 0 0 0); transform: translate(0); }
  90% { clip-path: inset(71% 0 22% 0); transform: translate(-7px, -6px); }
  95% { clip-path: inset(6% 0 89% 0); transform: translate(9px, 4px); }
  100% { clip-path: inset(0 0 0 0); transform: translate(0); }
}

@keyframes glitch-periodic {
  0%, 92% { opacity: 0; animation-play-state: paused; }
  93%, 100% { opacity: 1; animation-play-state: running; }
}

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const output = document.getElementById("terminal-output");
    const loader = document.getElementById("hack-loader");
    const randomLines = [
      "Loading kernel module...", "Injecting 0x004F3A...", "Patching memory region...",
      "Decrypting block...", "Verifying checksum...", "Syncing IO buffer...",
      "Running deep scan...", "Bypassing gatekeeper...", "Establishing secure tunnel...",
      "Reading sector 14...", "Analyzing packets...", "Attempting handshake...",
      "Granting permissions...", "Scanning host...", "Authenticating...",
      "Compiling assets...", "Generating entropy...", "Allocating heap...",
      "Spawning worker thread...", "Executing shell routine..."
    ];
    const spamDuration = 2000;
    const spamInterval = 10;
    const endTime = Date.now() + spamDuration;
    const spammer = setInterval(() => {
      if (Date.now() >= endTime) {
        clearInterval(spammer);
        finalMessage();
        return;
      }
      const line = randomLines[Math.floor(Math.random() * randomLines.length)];
      const div = document.createElement("div");
      div.textContent = "> " + line;
      output.appendChild(div);
      output.scrollTop = output.scrollHeight;
    }, spamInterval);

    function finalMessage() {
      const text = "Welcome, Hackers !?";
      let i = 0;
      const div = document.createElement("div");
      div.style.marginTop = "1rem";
      div.style.color = "#da0000";
      div.style.textShadow = "0 0 6px #da0000";
      output.appendChild(div);
      const typer = setInterval(() => {
        div.textContent = "> " + text.substring(0, i);
        i++;
        if (i > text.length) {
          clearInterval(typer);
          setTimeout(() => {
            loader.classList.add("fade-out");
            setTimeout(() => loader.remove(), 800);
          }, 900);
        }
        output.scrollTop = output.scrollHeight;
      }, 60);
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    const typingElement = document.getElementById("typing-text");
    const textToType = "DUNE";
    let currentIndex = 0;
    let isDeleting = false;
    let typingSpeed = 150;
    let deletingSpeed = 100;
    let timeoutId = null;

    function typeText() {
      if (timeoutId) clearTimeout(timeoutId);
      if (!isDeleting) {
        typingElement.textContent = textToType.substring(0, currentIndex);
        currentIndex++;
        if (currentIndex > textToType.length) {
          timeoutId = setTimeout(() => {
            isDeleting = true;
            currentIndex = textToType.length;
            typeText();
          }, 2000);
        } else {
          timeoutId = setTimeout(typeText, typingSpeed);
        }
      } else {
        currentIndex--;
        typingElement.textContent = textToType.substring(0, currentIndex);
        if (currentIndex < 0) {
          isDeleting = false;
          currentIndex = 0;
          timeoutId = setTimeout(typeText, 500);
        } else {
          timeoutId = setTimeout(typeText, deletingSpeed);
        }
      }
    }
    timeoutId = setTimeout(typeText, 1000);
  });

  document.addEventListener("DOMContentLoaded", () => {
    const encryptedTextElement = document.getElementById("encrypted-text");
    if (!encryptedTextElement) return;
    const originalHTML = encryptedTextElement.innerHTML;
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = originalHTML;
    const parts = originalHTML.split(/<br\s*\/?>/i);
    const textParts = parts.map(part => {
      const div = document.createElement('div');
      div.innerHTML = part;
      return div.textContent || div.innerText || '';
    });
    const encryptedChars = "!@#$%^&*()0123456789ABC]HIJKLMefghijklmnopq]vwxyz";

    function getRandomEncryptedChar() {
      return encryptedChars[Math.floor(Math.random() * encryptedChars.length)];
    }

    function scrambleText(text, revealProgress = 0) {
      let scrambled = "";
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === ' ') {
          scrambled += char;
        } else {
          const shouldReveal = (i / text.length) <= revealProgress;
          if (shouldReveal) {
            scrambled += char;
          } else {
            if (Math.random() < 0.3) {
              scrambled += getRandomEncryptedChar();
            } else {
              scrambled += char;
            }
          }
        }
      }
      return scrambled;
    }

    let animationInterval = null;
    let isAnimating = false;

    function animateEncryption() {
      if (isAnimating) return;
      isAnimating = true;
      let iteration = 0;
      const maxIterations = 30;
      const scrambledParts = textParts.map(part => scrambleText(part, 0));
      encryptedTextElement.innerHTML = scrambledParts.join('<br>');

      animationInterval = setInterval(() => {
        iteration++;
        const progress = Math.min(iteration / maxIterations, 1);
        const decryptedParts = textParts.map((part, partIndex) => {
          const partProgress = Math.max(0, progress - (partIndex * 0.1));
          return scrambleText(part, partProgress);
        });
        encryptedTextElement.innerHTML = decryptedParts.join('<br>');
        if (progress >= 1) {
          clearInterval(animationInterval);
          animationInterval = null;
          setTimeout(() => {
            encryptedTextElement.innerHTML = originalHTML;
            isAnimating = false;
          }, 300);
        }
      }, 30);
    }

    function stopAnimation() {
      if (animationInterval) {
        clearInterval(animationInterval);
        animationInterval = null;
      }
      isAnimating = false;
      encryptedTextElement.innerHTML = originalHTML;
    }
    encryptedTextElement.addEventListener('mouseenter', () => { animateEncryption(); });
    encryptedTextElement.addEventListener('mouseleave', () => { stopAnimation(); });
  });

  function startCountdown() {
      const presentation = {{ CyberdunePresentation | default({'mode': 'platform'}) | tojson }};
      if (presentation.mode !== 'event') {
        document.getElementById('timer-label').textContent = 'PLATFORM READY';
        document.getElementById('ctf-countdown').innerHTML = '<div class="ctf-breached">CAPTURE THE FLAG</div>';
        return;
      }
      const ctfStartDate = presentation.start * 1000;
      const ctfEndDate = presentation.end * 1000;

      let currentPhase = "before"; // before, running, finished
      const timerLabelEl = document.getElementById('timer-label');

      const timer = setInterval(function() {
          const now = new Date().getTime();

          // Check if CTF finished
          if (now >= ctfEndDate) {
             if (currentPhase !== "finished") {
                 clearInterval(timer);
                 document.getElementById('ctf-countdown').innerHTML = "<div class='ctf-breached'>SYSTEM BREACHED</div>";
                 if (timerLabelEl) timerLabelEl.textContent = '';
                 currentPhase = "finished";
             }
             return;
          }

          // Check if CTF is running
          if (now >= ctfStartDate && now < ctfEndDate) {
              if (currentPhase !== "running") {
                  if (timerLabelEl) timerLabelEl.textContent = 'CTF ENDS IN:';
                  currentPhase = "running";
              }

              const gapEnd = ctfEndDate - now;

              const second = 1000;
              const minute = second * 60;
              const hour = minute * 60;
              const day = hour * 24;

              let d = Math.floor(gapEnd / day);
              let h = Math.floor((gapEnd % day) / hour);
              let m = Math.floor((gapEnd % hour) / minute);
              let s = Math.floor((gapEnd % minute) / second);

              setCountdown(d, h, m, s);
              return;
          }

          // CTF hasn't started yet
          if (currentPhase !== "before") {
              if (timerLabelEl) timerLabelEl.textContent = 'CTF STARTS IN:';
              currentPhase = "before";
          }

          const gap = ctfStartDate - now;

          const second = 1000;
          const minute = second * 60;
          const hour = minute * 60;
          const day = hour * 24;

          let d = Math.floor(gap / day);
          let h = Math.floor((gap % day) / hour);
          let m = Math.floor((gap % hour) / minute);
          let s = Math.floor((gap % minute) / second);

          setCountdown(d, h, m, s);

      }, 1000);
  }

  function setCountdown(d, h, m, s) {
      const elD = document.getElementById('cd-days');
      const elH = document.getElementById('cd-hours');
      const elM = document.getElementById('cd-minutes');
      const elS = document.getElementById('cd-seconds');
      if (elD) { elD.style.setProperty('--value', d); elD.setAttribute('aria-label', d); }
      if (elH) { elH.style.setProperty('--value', h); elH.setAttribute('aria-label', h); }
      if (elM) { elM.style.setProperty('--value', m); elM.setAttribute('aria-label', m); }
      if (elS) { elS.style.setProperty('--value', s); elS.setAttribute('aria-label', s); }
  }

  document.addEventListener("DOMContentLoaded", startCountdown);

  function cloneSlides(trackElement) {
    const slides = Array.from(trackElement.children);

      const clone = slide.cloneNode(true);
      clone.setAttribute('aria-hidden', true);
      trackElement.appendChild(clone);
    });

      textTrack.appendChild(item);

    // Clone for infinite loop
    cloneSlides(textTrack);
