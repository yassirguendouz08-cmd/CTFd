<div class="ctfd-alerts">
  {% for info in infos %}
    <div class="ctfd-alert ctfd-alert-info" role="alert">
      <div class="ctfd-alert-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>
      <span class="ctfd-alert-text">{{ info }}</span>
      <button type="button" class="ctfd-alert-close" onclick="this.parentElement.style.opacity='0';this.parentElement.style.transform='translateY(-10px)';setTimeout(()=>this.parentElement.remove(),300)" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  {% endfor %}

  {% for error in errors %}
    <div class="ctfd-alert ctfd-alert-danger" role="alert">
      <div class="ctfd-alert-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <span class="ctfd-alert-text">{{ error }}</span>
      <button type="button" class="ctfd-alert-close" onclick="this.parentElement.style.opacity='0';this.parentElement.style.transform='translateY(-10px)';setTimeout(()=>this.parentElement.remove(),300)" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  {% endfor %}
</div>

<style>
  .ctfd-alerts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 1rem;
    max-width: 600px;
    margin: 0 auto;
    margin-bottom: 2.5rem;
  }

  .ctfd-alert {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    font-family: "Hack", monospace;
    font-size: 0.82rem;
    letter-spacing: 0.3px;
    position: relative;
    overflow: hidden;
    animation: alert-slide-in 0.4s cubic-bezier(0.2, 0.7, 0.35, 1);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  @keyframes alert-slide-in {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Info Alert */
  .ctfd-alert-info {
    background: linear-gradient(135deg, rgba(0, 140, 255, 0.12), rgba(0, 80, 180, 0.08));
    border: 1px solid rgba(0, 140, 255, 0.25);
    color: #8ecfff;
  }

  .ctfd-alert-info .ctfd-alert-icon {
    color: #4da8ff;
    filter: drop-shadow(0 0 4px rgba(0, 140, 255, 0.4));
  }

  /* Danger Alert */
  .ctfd-alert-danger {
    background: linear-gradient(135deg, rgba(218, 0, 0, 0.12), rgba(140, 0, 0, 0.08));
    border: 1px solid rgba(218, 0, 0, 0.30);
    color: #ff8a8a;
  }

  .ctfd-alert-danger .ctfd-alert-icon {
    color: #ff4d4d;
    filter: drop-shadow(0 0 4px rgba(218, 0, 0, 0.4));
  }

  /* Success Alert */
  .ctfd-alert-success {
    background: linear-gradient(135deg, rgba(0, 180, 80, 0.12), rgba(0, 120, 60, 0.08));
    border: 1px solid rgba(0, 180, 80, 0.30);
    color: #7dffb3;
  }

  .ctfd-alert-success .ctfd-alert-icon {
    color: #3ddc84;
    filter: drop-shadow(0 0 4px rgba(0, 180, 80, 0.4));
  }

  .ctfd-alert-icon {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .ctfd-alert-text {
    flex: 1;
    line-height: 1.4;
  }

  .ctfd-alert-close {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }

  .ctfd-alert-close:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
  }

  .ctfd-alert-danger .ctfd-alert-close:hover {
    color: #ff4d4d;
    background: rgba(218, 0, 0, 0.15);
  }

  .ctfd-alert-info .ctfd-alert-close:hover {
    color: #4da8ff;
    background: rgba(0, 140, 255, 0.15);
  }

  .ctfd-alert-success .ctfd-alert-close:hover {
    color: #3ddc84;
    background: rgba(0, 180, 80, 0.15);
  }
</style>
