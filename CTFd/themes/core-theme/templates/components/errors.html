<div class="ctfd-alerts">
  {% for info in infos %}
    <div class="ctfd-alert ctfd-alert-info" role="alert">
      <div class="ctfd-alert-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>
      <span class="ctfd-alert-text">{{ info }}</span>
      <button type="button" class="ctfd-alert-close" onclick="this.parentElement.style.opacity='0';this.parentElement.style.transform='translateY(-10px)';setTimeout(()=>this.parentElement.remove(),300)" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  {% endfor %}

  {% for error in errors %}
    <div class="ctfd-alert ctfd-alert-danger" role="alert">
      <div class="ctfd-alert-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <span class="ctfd-alert-text">{{ error }}</span>
      <button type="button" class="ctfd-alert-close" onclick="this.parentElement.style.opacity='0';this.parentElement.style.transform='translateY(-10px)';setTimeout(()=>this.parentElement.remove(),300)" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  {% endfor %}
</div>
