<footer class="cd-footer"><div class="container cd-footer-inner">
  <div class="cd-footer-signature">
    <div class="cd-footer-flags">
      <img src="{{ url_for('views.themes_beta', theme='core-theme', path='img/flag-palestine.webp') }}" width="40" height="28" alt="Palestine">
      <img src="{{ url_for('views.themes_beta', theme='core-theme', path='img/flag-morocco.webp') }}" width="40" height="28" alt="Morocco">
    </div>
    <span class="cd-footer-credit">Developed by <span class="cd-footer-credit-name">Yassir Guendouz</span></span>
  </div>
  <div class="cd-footer-language"><label for="language-select">Language</label>
    <select id="language-select" class="form-select" x-data="LanguageForm" @change="set({target: $event.target.selectedOptions[0]})">
      {% for code, name in [('en', 'English'), ('fr', 'Français'), ('ar', 'العربية')] %}<option value="{{ code }}" {% if get_locale() == code %}selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
  </div>
</div></footer>
