<footer class="cd-footer"><div class="container cd-footer-inner">
  <div><strong>CYBERDUNE</strong><p>Capture the flag. Build your skills.</p></div>
  <span class="cd-footer-credit">Developed by Yassir Guendouz</span>
  <div class="cd-footer-language"><label for="language-select">Language</label>
    <select id="language-select" class="form-select" x-data="LanguageForm" @change="set({target: $event.target.selectedOptions[0]})">
      {% for language in Languages %}<option value="{{ language.value }}" {% if get_locale() == language.value %}selected{% endif %}>{{ language.name.replace('_', ' ').title() }}</option>{% endfor %}
    </select>
  </div>
</div></footer>
