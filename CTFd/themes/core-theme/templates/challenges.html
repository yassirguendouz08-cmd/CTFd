{% extends "base.html" %}



{% block content %}
<style>
  /* =========================================================
     Challenge cards — Sci-fi chamfered design
  ========================================================= */

  .container-challenges {
    margin-bottom: 2.5rem;
  }

  .category-header {
    border-bottom: 2px solid #444;
    padding-bottom: 0.5rem;
  }

  .challenges-row {
    width: 100%;
  }

  /* =========================================
     1. Normal State (The Base Shape)
  ========================================= */
  .challenge-button {
    position: relative;
    background-color: #8b1a1a !important;
    color: #ffffff !important;
    border: none !important;
    border-radius: 0 !important;
    text-align: left;
    cursor: pointer;
    overflow: hidden;

    /* Sci-fi chamfered corners with side notches */
    clip-path: polygon(
      12px 0,
      calc(100% - 12px) 0,
      100% 12px,
      100% calc(50% - 8px),
      calc(100% - 4px) 50%,
      100% calc(50% + 8px),
      100% calc(100% - 12px),
      calc(100% - 12px) 100%,
      12px 100%,
      0 calc(100% - 12px),
      0 calc(50% + 8px),
      4px 50%,
      0 calc(50% - 8px),
      0 12px
    );

    transition: all 0.2s ease-in-out;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 15px !important;
  }

  .challenge-button:focus {
    outline: none;
  }

  .challenge-title {
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.1;
    margin: 0;
    padding-right: 7rem;
    color: #ffffff;
    transition: color 0.2s ease;
  }

  /* =========================================
     2. Hover State
  ========================================= */
  .challenge-button:hover {
    background-color: #da0000 !important;
    transform: translate(-4px, -4px);
    filter: drop-shadow(6px 6px 0px #ff3c5c);
  }

  .challenge-button:hover .challenge-title {
    color: #ffffff !important;
  }

  /* =========================================
     3. Solved State & GIF Overlay
  ========================================= */
  .challenge-button.challenge-solved {
    background-color: #3d1111 !important;
    filter: none;
    transform: none;
    opacity: 0.9;
  }

  .challenge-button.challenge-solved .challenge-title,
  .challenge-button.challenge-solved .challenge-stats {
    opacity: 0.6;
  }

  /* don't switch solved title to black on hover */
  .challenge-button.challenge-solved:hover .challenge-title,
  .challenge-button.challenge-solved:focus-visible .challenge-title {
    color: #ffc6c6;
  }

  .challenge-button.challenge-solved:hover,
  .challenge-button.challenge-solved:focus-visible {
    background-color: #4d1515 !important;
  }

  /* Animated GIF overlay for solved challenges */
  .challenge-button.challenge-solved::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 140px;
    background-image: url('{{ url_for('views.themes_beta', theme='core-theme', path='img/solve_gif.gif') }}');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 10;
    pointer-events: none;
  }

  /* the right pill becomes muted green/grey when solved */
  .challenge-button.challenge-solved .challenge-pill {
    background: rgba(219, 190, 190, .85);
    color: #421a1a;
  }

  /* =========================================
     4. Pills (Tags) & Stats
  ========================================= */
  .challenge-pill {
    position: absolute;
    right: 1.35rem;
    top: 50%;
    transform: translateY(-50%);
    padding: .35rem .85rem;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.85rem;
    background: #ff7676;
    color: #000000;
    white-space: nowrap;
    border: none;
  }

  /* Color the pill by category */
  .category-web .challenge-pill { background: #76d792; }
  .category-crypto .challenge-pill { background: #76a6ff; }
  .category-forensics .challenge-pill { background: #c98dff; }
  .category-warmup .challenge-pill { background: #ffd36b; }

  .challenge-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    color: #ffffff;
    font-weight: bold;
    font-size: 1.2rem;
    margin-top: auto;
  }

  .challenge-stat {
    display: inline-flex;
    gap: .6rem;
    align-items: center;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }

  .challenge-stat i {
    font-size: 1.55rem;
  }
</style>
  <div class="container">
    <div class="jumbotron text-center">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div
      x-data="ChallengeBoard"
      @load-challenges.window="loadChallenges()"
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <svg class="spinner-svg" viewBox="0 0 50 50">
              <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="container-challenges">
            <div class="category-header mb-1r">
              <h3 class="title-h3" x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row w-100">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-4">
                    <button
                        class="challenge-button btn w-100 h-100"
                        :class="[
                          (c.solved_by_me || c.solved) ? 'challenge-solved' : '',
                          `category-${category.toLowerCase().replace(/ /g, '-')}`,
                          ...(c.tags || []).map((tag) => `tag-${tag.value.toLowerCase().replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >
                      <!-- Solved GIF overlay is handled via CSS ::after on .challenge-solved -->

                      <p class="challenge-title" x-text="c.name"></p>

                      <span class="challenge-pill" x-text="category"></span>

                      <div class="challenge-stats">
                        <div class="challenge-stat">
                          <i class="fas fa-flag"></i>
                          <!-- Works across different API fields (CTFd versions/plugins) -->
                          <span x-text="(c.solves ?? c.solves_count ?? c.solve_count ?? 0)"></span>
                        </div>

                        <div class="challenge-stat">
                          <i class="fas fa-star"></i>
                          <span x-text="c.value"></span>
                        </div>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
