worker_processes auto;
events { worker_connections 1024; }
http {
  limit_req_zone $binary_remote_addr zone=cyberdune_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=cyberdune_auth:10m rate=10r/s;
  upstream app_servers { server ctfd:8000; }
  server {
    listen 80;
    gzip on;
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    limit_req zone=cyberdune_general burst=100 nodelay;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Connection "";
    proxy_redirect off;
    location ~ ^/(register|login|reset_password|confirm)(/|$) {
      client_max_body_size 64k;
      limit_req zone=cyberdune_auth burst=60 nodelay;
      proxy_pass http://app_servers;
    }
    location /events {
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
    }
    location / { proxy_pass http://app_servers; }
  }
}
