worker_processes auto;
events { worker_connections 1024; }
http {
  limit_req_zone $binary_remote_addr zone=cyberdune_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=cyberdune_auth:10m rate=10r/s;
  upstream app_servers { server ctfd:8000; }
  server {
    listen 80;
    # Nginx is the public response-header authority; replace upstream copies to
    # avoid duplicate CSP/X-Frame-Options values. HSTS is honored by browsers
    # only when this response is delivered over HTTPS by the outer TLS proxy.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' wss:; frame-src 'self' https:; media-src 'self' data: blob: https:; worker-src 'self' blob:" always;
    gzip on;
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    limit_req zone=cyberdune_general burst=100 nodelay;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Connection "";
    proxy_redirect off;
    location ~ ^/(register|login|reset_password|confirm)(/|$) {
      client_max_body_size 64k;
      limit_req zone=cyberdune_auth burst=60 nodelay;
      proxy_pass http://app_servers;
    }
    location /events {
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
    }
    location / { proxy_pass http://app_servers; }
  }
}
