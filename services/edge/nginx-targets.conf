# Public challenge edge: *.targets.cyberdune.online -> Traefik -> gateway.
# Install as /etc/nginx/conf.d/cyberdune-targets.conf after the wildcard
# certificate exists. The platform cookie stays host-only for ctf.cyberdune.online
# because this block never proxies to CTFd.
server {
    listen 443 ssl http2;
    server_name ~^(?<instance>[a-z0-9-]{1,63})\.targets\.cyberdune\.online$;

    ssl_certificate     /etc/letsencrypt/live/targets.cyberdune.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/targets.cyberdune.online/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# Plain HTTP is only a redirect; challenge traffic is TLS-only.
server {
    listen 80;
    server_name ~^(?<instance>[a-z0-9-]{1,63})\.targets\.cyberdune\.online$;
    return 301 https://$host$request_uri;
}
