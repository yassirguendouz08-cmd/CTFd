  <text x="160" y="861" fill="#c0c7d2" font-family="sans-serif" font-size="15">We found a small web service that behaves differently depending on</text><text x="160" y="886" fill="#c0c7d2" font-family="sans-serif" font-size="15">how the request is formed. Inspect the response carefully and follow</text><text x="160" y="911" fill="#c0c7d2" font-family="sans-serif" font-size="15">the evidence to the flag.</text><text x="160" y="961" fill="#f4f5f8" font-family="sans-serif" font-size="17" font-weight="600">Files</text><text x="160" y="988" fill="#a7afbd" font-family="sans-serif" font-size="14">Nothing to download — investigate the live challenge service.</text>
