    <text x="154" y="582" fill="#f4f5f8" font-size="22" font-weight="700">Last Known Good</text><text x="154" y="611" fill="#a7afbd" font-size="14">Reconstruct a short incident timeline</text><text x="154" y="632" fill="#a7afbd" font-size="14">from a collection of system artifacts.</text><path d="M154 658h332" stroke="#303641"/><text x="154" y="682" fill="#d0d5de" font-family="monospace" font-size="12">⚑ 8 solves</text><text x="385" y="682" fill="#d0d5de" font-family="monospace" font-size="12">★ 100 points</text>
