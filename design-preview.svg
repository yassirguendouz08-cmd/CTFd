    <text x="554" y="582" fill="#f4f5f8" font-size="22" font-weight="700">Quiet Redirect</text><text x="554" y="611" fill="#a7afbd" font-size="14">Trace an unexpected redirect and identify</text><text x="554" y="632" fill="#a7afbd" font-size="14">the server-side condition behind it.</text><path d="M554 658h332" stroke="#303641"/><text x="554" y="682" fill="#d0d5de" font-family="monospace" font-size="12">⚑ 3 solves</text><text x="785" y="682" fill="#d0d5de" font-family="monospace" font-size="12">★ 250 points</text>
